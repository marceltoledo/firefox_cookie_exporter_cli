[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fcookex"
version = "0.1.0"
description = "CLI tool to search Firefox cookies and export them in Netscape format"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "typer>=0.12",
    "InquirerPy>=0.3.4",
    "rich>=13",
]

[project.scripts]
fcookex = "fcookex.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-mock>=3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["fcookex*"]
